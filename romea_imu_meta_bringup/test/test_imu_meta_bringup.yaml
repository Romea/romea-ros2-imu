name: imu
namespace: ns
launch:
  - node:
      pkg: romea_imu_meta_bringup
      profile: config/xsens_driver.profile.yaml
      param:
        - name: device
          value: "/dev/ttyUSB0"
        - name: baudrate
          value: 115200
configuration:
  manufacturer: xsens
  model: mti
  rate: 100
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0]
  rpy: [4.0, 5.0, 6.0]
records:
  data: true
