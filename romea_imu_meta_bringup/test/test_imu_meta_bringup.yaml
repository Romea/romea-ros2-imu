name: imu
namespace: ns
launch_file:
  imu_driver:
    profile: xsens_driver_profile.yaml
    configuration:
      driver:
        parameters:
          device: "/dev/ttyUSB0"
          baudrate: 115200
configuration:
  manufacturer: xsens
  model: mti
  rate: 100
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0]
  rpy: [4.0, 5.0, 6.0]
records:
  data: true
