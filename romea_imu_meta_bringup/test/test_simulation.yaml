name: imu
namespace: ns
launch:
  - include:
      file: $(find-pkg-share romea_imu_meta_bringup)/profile/gz_bridge.launch.py
      if: $(eval "'$(var mode)' == 'simulation_gazebo'")
configuration:
  manufacturer: xsens
  model: mti
  rate: 100
location:
  parent_link: "base_link"
  xyz: [1.0, 2.0, 3.0]
  rpy: [4.0, 5.0, 6.0]
records:
  data: true
