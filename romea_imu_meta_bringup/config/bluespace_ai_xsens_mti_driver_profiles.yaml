driver:
  package: bluespace_ai_xsens_mti_driver
  executable: xsens_mti_node
  parameters:
    port:
      source:
        from: imu_driver_configuration
        parameter: driver.parameters.port
    baudrate:
      source:
        from: imu_driver_configuration
        parameter: driver.parameters.baudrate
    scan_for_devices: False
    pub_imu: True
    pub_quaternion: False
    pub_mag: False
    pub_angular_velocity: False
    pub_acceleration: False
    pub_free_acceleration: False
    pub_dq: False
    pub_dv: False
    pub_sampletime: False
    pub_temperature: False
    pub_pressure: False
    pub_gnss: False
    pub_twist: False
    pub_transform: False
    pub_positionLLA: False
    pub_velocity: False
