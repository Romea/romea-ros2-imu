driver:
  package: xsens_driver
  executable: mtnode.py
  parameters:
    device:
      source:
        from: imu_driver_configuration
        parameter: driver.parameters.device
    baudrate:
      source:
        from: imu_driver_configuration
        parameter: driver.parameters.baudrate
    initial_wait: 1.0
    timeout: 0.01
    angular_velocity_covariance_diagonal: [0.0, 0.0, 0.0]
    linear_acceleration_covariance_diagonal: [0.0, 0.0, 0.0]
    orientation_covariance_diagonal: [0.0, 0.0, 0.0]
  remappings:
    imu/data: data
    imu/data_str: data_str
    imu/mag: mag
